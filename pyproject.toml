[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loop"
version = "0.0.1"
description = "An experimental agentic loop for OpenAI-compatible Responses API servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpcore>=1.0.9,<2",
    "httpx>=0.28.1,<1",
    "jsonschema>=4.25.1,<5",
    "openai>=2.46.0,<3",
    "pathspec>=1.0.0,<2",
    "prompt-toolkit>=3.0.52,<4",
    "pydantic>=2.13.0,<3",
    "python-dotenv>=1.2.2,<2",
    "pyyaml>=6.0.3,<7",
    "rich>=14.1.0,<15",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/jsconan/loop"
"Bug Tracker" = "https://github.com/jsconan/loop/issues"

[project.scripts]
loop = "loop.main:main"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0,<5",
    "pylint>=4.0.7,<5",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.16.2,<1",
]
lint = ["ruff", "pylint"]
test = ["pytest-cov", "pytest"]

[tool.uv]
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/loop"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint]
max-line-length = 100
disable = [
    "C0302", # (too-many-lines)
    "R0801", # (duplicate-code)
    "R0902", # (too-many-instance-attributes)
    "R0903", # (too-few-public-methods)
    "R0904", # (too-many-public-methods)
    "R0911", # (too-many-return-statements)
    "R0913", # (too-many-arguments)
    "R0914", # (too-many-locals)
    "R0917", # (too-many-positional-arguments)
    "W0511", # (fixme)
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "too-many-lines",
    "duplicate-code",
    "too-many-instance-attributes",
    "too-few-public-methods",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    "fixme",
]

[tool.pytest.ini_options]
addopts = ["-ra", "-q"]
testpaths = ["tests/"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/loop"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.paths]
source = ["src/loop"]
tests = ["tests/"]
