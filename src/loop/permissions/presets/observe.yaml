version: 1
kind: loop.permission-preset
metadata:
  id: observe
  revision: "1"
  title: Observe
  description: Allow scoped local filesystem reads and deny every other authority-requiring operation.
defaults:
  filesystem.list: allow
  filesystem.read: allow
  filesystem.create: deny
  filesystem.replace: deny
  filesystem.delete: deny
  network.request: deny
  process.execute: deny
  session.mutate: deny
rules: []
